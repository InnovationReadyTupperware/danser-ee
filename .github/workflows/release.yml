name: Build danser

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer 2.0.0 release version without a leading v'
        type: string
        required: true
      previous_version:
        description: 'Previous release version for the compare link (blank uses the newest reachable SemVer tag)'
        type: string
        required: false
        default: ''
      draft:
        description: 'Create draft release'
        type: boolean
        required: false
        default: true
      sign:
        description: 'Sign files (Windows only)'
        type: boolean
        required: false
        default: false

jobs:
  build_windows:
    name: Building windows version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash scripts/validate-semver.sh "$RELEASE_VERSION"

      - name: Install winlibs
        uses: bwoodsend/setup-winlibs-action@v1

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/config-extractor/go.sum

      - name: Build danser
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SIGN_RELEASE: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"

          export DANSER_BUILD_MODE=0

          if [[ "$SIGN_RELEASE" == 'true' ]]
          then
            export DANSER_BUILD_MODE=1

            ./dist-win.sh "$version"

            if [[ ! -f "dist/build-win/danser-core.dll" ]]; then
              echo "Danser failed to build"
              exit 1
            fi
          else

            ./dist-win.sh "$version"

            if [[ ! -f "dist/artifacts/danser-${version}-win.zip" ]]; then
              echo "Danser failed to build"
              exit 1
            fi
          fi

        id: build

      - name: Sign files with Artifact Signing
        if: ${{ inputs.sign == true || inputs.sign == 'true' }}
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: mailatwiekume
          certificate-profile-name: danser
          files-folder: ${{ github.workspace }}/dist/build-win
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Pack danser
        if: ${{ inputs.sign == true }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"

          export DANSER_BUILD_MODE=2

          ./dist-win.sh "$version"

          if [[ ! -f "dist/artifacts/danser-${version}-win.zip" ]]; then
            echo "Danser failed to build"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: danser-win
          path: dist/artifacts/*
          if-no-files-found: error

  build_linux:
    name: Building linux version
    # The bundled Linux BASS libraries are not accepted by Ubuntu 24's newer
    # linker yet. Keep this job on the last compatible runner until they are
    # rebuilt for the newer toolchain.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash scripts/validate-semver.sh "$RELEASE_VERSION"

      - name: Install needed packages
        run: |
          sudo apt-get update
          sudo apt-get install xorg-dev libgl1-mesa-dev libgtk-3-dev

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/config-extractor/go.sum

      - name: Build danser
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"

          bash dist-linux.sh "$version"

          if [[ ! -f "dist/artifacts/danser-${version}-linux.zip" ]]; then
            echo "Danser failed to build"
            exit 1
          fi
        id: build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: danser-linux
          path: dist/artifacts/*
          if-no-files-found: error

  publish_release:
    name: Publish release
    if: ${{ !cancelled() && needs.build_windows.result == 'success' && needs.build_linux.result == 'success' }}
    needs: [build_windows, build_linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: danser-*
          path: artifacts
          merge-multiple: true
      - name: Create release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
          DRAFT_RELEASE: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          notes_file="$(mktemp)"
          trap 'rm -f -- "$notes_file"' EXIT

          version="$RELEASE_VERSION"
          bash scripts/validate-semver.sh "$version"

          assets=(artifacts/*.zip artifacts/*.tar.xz)
          if (( ${#assets[@]} == 0 )); then
            echo "No release archives were downloaded" >&2
            exit 1
          fi

          bash scripts/prepare-release-notes.sh "$version" "$PREVIOUS_VERSION" > "$notes_file"

          release_args=("$version" --title "$version" --target main --notes-file "$notes_file")
          if [[ "$DRAFT_RELEASE" == 'true' ]]; then
            release_args+=(--draft)
          fi

          version_without_build="${version%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}" "${assets[@]}"
